# "Why choose me" section of the About page.
# "image" is a file inside assets/images/answers/ (cropped to 16:10).

description: >
  Why should you choose me instead of another service
  for your business?

answers:

  - q: Big tech platforms don't serve your interests
    a: >
      **Free platforms don't work for your business:
      they work for theirs.** They show data and
      suggestions that can put your customers off
      (*"usually very busy"*) and steer them towards
      others who might be buying advertising.
    image: locale-affollato.jpg

  - q: They can use you to promote your competitors
    a: >
      Even when a potential customer visits your
      profile on their platforms, **they may suggest
      your direct competitors.** It's a mechanism designed
      to favour those who advertise with them. Notice
      this: when a business pays for visibility, the
      suggested competitors disappear from its listing.
    image: consigliano-altri.jpg

  - q: What I do for you
    a: >
      I, on the other hand, work directly for you: I analyse
      data transparently, create tailored strategies
      and help you attract customers without distortions,
      also using [Venice.bio](https://venice.bio), a powerful
      promotional website that I offer you for free
      in some of my consulting packages.
      This way you turn data into a competitive
      advantage, not a risk.
    image: venice-bio.jpg
