description: >
  Here are some examples of what you can get by hiring me for
  2.5 / 6 / 12 hours. Remember that I can do much more
  for you and your business, so don't hesitate to
  contact me if you'd like a quote for
  a specific job.

examples:
  - title: Optimising your Google and TripAdvisor profiles
    description: >
      I update the information on your profiles about your
      business. When possible, and if you provide them,
      I add your new promotional photos to present your
      business at its best.
    duration: 2.5

  - title: Promoting your business on two social networks for a month
    description: >
      I will create one post a week for your business
      and publish it on two social networks (usually Google My Business +
      Instagram, but you can choose).

      <br><br>**Extras that can be added:**<br>
      <ul><li>Two posts a week instead of one cost an additional 2.5 hours of work.</li>
      <li>Three posts a week instead of one cost an additional 5 hours of work.</li></ul>

      <br>**Good to know before requesting the job**<br>
      You will need to provide high-quality photos of your
      premises and of your products / services, which I will
      then adapt to the format required by the social networks.
      If you don't have any photographic material,
      I can bring a professional photographer at an extra cost.
    duration: 2.5

  - title: Registering a web domain and a business email
    description: >
      I register a business web domain for you, such as
      *www.company.com*, and associate one or more
      business email addresses with it, such as
      *mario.rossi@company.com*
    duration: 2.5

  - title: Two-language price list with wine and drinks list
    description: >
      I create a printed price list in two languages
      (usually Italian + English), including a wine list
      of up to two pages and a drinks and coffee list of
      up to one page. Printing the menus on paper is not
      included in the price.
    duration: 5

  - title: Domain + basic landing page
    description: >
      I register a web domain and one or more business
      email addresses for you, and create a simple landing page
      in a single language (usually Italian) showing
      links to your social profiles and your external
      photo galleries. One update to the landing page within
      12 months is included in the price.
    duration: 6

  - title: Price list in four languages with wine and drinks list
    description: >
      I create a printed price list in four languages
      (usually Italian + English + French + German), including a
      wine list of up to 60 entries and a drinks and coffee
      list of up to one page. To comply with the law, you also
      receive an allergen table, to be filled in by hand by
      the restaurant's chef.

      <br>**Extras that can be added:**<br>
      <ul><li>Each extra language in the menu costs an additional 1 hour of work.</li>
      <li>Beyond the first 60 included, every 30 extra entries in the wine list cost an additional 1 hour of work.</li>
      <li>Creating price lists for outdoor display costs an additional 2 hours of work.</li></ul>

      <br>**Good to know before requesting the job**<br>
      Printing the menus on paper is not included in the price.
    duration: 7

  - title: Domain + professional email + two-language landing page
    description: >
      I register a web domain and a professional-grade business
      mailbox for you, and create a medium-length landing page
      in two languages (usually Italian + English)
      presenting your business, with a short photo gallery of
      your products and services (up to 16 photos) and a photo
      gallery showcasing your work (up to 16 photos). One update
      to the landing page within 12 months is included in the price.

      <br><br>**Good to know before requesting the job**<br>
      You will need to provide high-quality photos of your
      premises and of your products / services, which I will
      then adapt to the format required for publication on
      your website. If you don't have any photographic material,
      I can bring a professional photographer at an extra cost.
    duration: 12
