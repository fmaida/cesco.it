# Lingue del sito. Ogni lingua ha i suoi permalink (le sezioni hanno nomi
# diversi negli URL) e i suoi testi in "params", che si fondono con quelli
# comuni di params.yaml.

it:
  weight: 1
  label: Italiano
  locale: it-IT
  permalinks:
    section:
      services: /servizi/
      lab: /laboratorio/
    page:
      services: /servizi/:slug/
      portfolio: /portfolio/:slug/
      lab: /laboratorio/:slug/
  params:
    description: >
      Pensa a me come a un’estetista per aziende: rendo bella e
      desiderabile la tua impresa, così che tu possa vendere di più.
    author:
      job: >
        Consulente digitale per aziende (siti web, social e comunicazione online)
      # Presentazione in terza persona per i dati strutturati (JSON-LD in head.html)
      bio: >
        Perito informatico e consulente digitale a Venezia: siti web, social
        network, comunicazione online e software su misura per il mondo
        dell'ospitalità (ristoranti, bar e alberghi) e per le piccole
        attività commerciali.
    # Assistenza clienti nei dati strutturati (contactPoint del JSON-LD)
    support:
      type: Assistenza clienti solo via SMS e WhatsApp
      note: Non disponibile per chiamate vocali, solo messaggi.
      area: Veneto, Italia
    # Frase grande in homepage (è l'h1): "prefix", poi il nome scritto "a
    # macchina" (uno alla volta, nel colore d'accento), poi "suffix".
    # Il primo nome è quello già scritto nell'HTML: lo leggono Google e chi
    # non ha JavaScript, prima che parta l'animazione.
    slogan:
      prefix: Rendo il tuo
      subjects:
        - RISTORANTE
        - ALBERGO
        - BAR
        - APPARTAMENTO
        - NEGOZIO
        - ARTIGIANATO
        - LAVORO
      suffix: bello e desiderabile su internet.
    contact:
      title: Contattami per un preventivo gratuito
      description: >
        Faremo una breve chiacchierata:
        alla fine dell’incontro ti presenterò
        subito alcune prime soluzioni. Se per
        risponderti in modo accurato dovrò
        raccogliere ulteriori informazioni
        (su costi o modalità), ti invierò la
        proposta completa nelle ore o nei giorni successivi.<br><br>
        Non vuoi usare il modulo? Inviami una
        <a href="mailto:{{ params.support.email }}?subject=Ho%20visto%20il%20sito%20web%20e%20ho%20delle%20domande">email</a>. 👋

en:
  weight: 2
  label: English
  locale: en-US
  permalinks:
    section:
      services: /services/
      lab: /lab/
    page:
      services: /services/:slug/
      portfolio: /portfolio/:slug/
      lab: /lab/:slug/
  params:
    description: >
      Think of me as a stylist for your business: I help it stand out,
      so customers choose you and you sell more.
    author:
      job: >
        Digital consultant for businesses (websites, social media and online communication)
      bio: >
        IT specialist and digital consultant in Venice, Italy: websites,
        social media, online communication and custom software for the
        hospitality industry (restaurants, bars and hotels) and for small
        businesses.
    support:
      type: Customer support via SMS and WhatsApp only
      note: Not available for voice calls, messages only.
      area: Veneto, Italy
    slogan:
      prefix: I make your
      subjects:
        - RESTAURANT
        - HOTEL
        - BAR
        - APARTMENT
        - SHOP
        - CRAFT
        - BUSINESS
      suffix: beautiful and desirable online.
    contact:
      title: Contact me for a free quote
      description: >
        We'll have a short chat: by the end of
        the meeting I'll present some first solutions
        right away. If I need to gather more
        information to give you an accurate answer
        (about costs or how to proceed), I'll send you
        the full proposal in the following hours or days.<br><br>
        Prefer not to use the form? Send me an
        <a href="mailto:{{ params.support.email }}?subject=I%20saw%20your%20website%20and%20I%20have%20some%20questions">email</a>. 👋
