# Configurazione generale del sito. Le altre chiavi stanno nei file
# accanto: languages.yaml (lingue e testi tradotti), params.yaml (dati
# comuni), menus.<lingua>.yaml (barra laterale), markup.yaml (markdown).

baseURL: https://cesco.it/
title: Francesco Maida

# Cartella in cui "hugo" (e build.py) scrivono il sito compilato.
# Percorso assoluto: Hugo non espande "~". "hugo server" lavora in memoria
# e non la tocca.
publishDir: /Users/cesco/Sites/cesco.it

timeZone: Europe/Rome

# Italiano alla radice (/), inglese sotto /en/
defaultContentLanguage: it
defaultContentLanguageInSubdir: false
disableDefaultLanguageRedirect: true

# Niente pagine automatiche per i tag: nelle voci delle collezioni
# "tags" serve solo ai filtri della griglia
disableKinds: [taxonomy, term]

# Solo HTML ovunque; il feed RSS è attivato nel front matter del blog
outputs:
  home: [html]
  section: [html]
  page: [html]

# File generati dalla home ("outputs" in content/_index.md e _index.en.md).
# Solo dalla home italiana, senza estensione: /.well-known/webfinger
# (Mastodon), /.well-known/atproto-did (Bluesky) e /.caddy (regole di Caddy);
# il suffisso vuoto toglie l'estensione e i tipi servono solo a Hugo (il
# Content-Type lo decide Caddy). Da tutte e due le lingue: llms.txt.
mediaTypes:
  application/jrd+json:
    suffixes: [""]
  text/x-atproto-did:
    suffixes: [""]
  text/x-caddyfile:
    suffixes: [""]

outputFormats:
  webfinger:
    mediaType: application/jrd+json
    baseName: webfinger
    path: .well-known
    isPlainText: true
    notAlternative: true
  atproto-did:
    mediaType: text/x-atproto-did
    baseName: atproto-did
    path: .well-known
    isPlainText: true
    notAlternative: true
  caddy:
    mediaType: text/x-caddyfile
    baseName: .caddy
    isPlainText: true
    notAlternative: true
  # /llms.txt e /en/llms.txt: presentazione e FAQ per le IA (layouts/home.llms.txt)
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

enableRobotsTXT: true
disableHugoGeneratorInject: true

# Valori predefiniti della sitemap: ogni pagina può sovrascriverli
# con "sitemap" nel front matter (le sezioni lo fanno con "cascade")
sitemap:
  changeFreq: monthly
  priority: 0.5

# Data di ultima modifica (lastmod nella sitemap, dateModified nel JSON-LD):
# "lastmod" nel front matter se c'è, altrimenti l'ultimo commit git del
# file, altrimenti la data del file. Mai "date", che è la data di
# pubblicazione (es. un gioco del 2018 non è stato modificato nel 2018).
enableGitInfo: true
frontmatter:
  lastmod: [lastmod, ":git", ":fileModTime"]

# Qualità delle immagini ridimensionate (layouts/_partials/responsive-image.html)
imaging:
  resampleFilter: Lanczos
  jpeg:
    quality: 82
  webp:
    quality: 82
  avif:
    quality: 75

module:
  hugoVersion:
    min: 0.146.0
    extended: false

# Minificazione: sempre attiva (anche con "hugo" da solo e "hugo server"),
# con le opzioni più spinte di tdewolff che non cambiano il risultato.
# Le stesse opzioni valgono per il pipe "minify" di CSS e JS.
minify:
  minifyOutput: true              # HTML, XML (sitemap, RSS), JSON, SVG generati
  tdewolff:
    html:
      keepComments: false
      keepSpecialComments: false
      keepDefaultAttrVals: false  # es. type="text" sugli input
      keepDocumentTags: false     # <head>/<body> senza attributi
      keepEndTags: false          # </p>, </li>… facoltativi in HTML5
      keepQuotes: false
      keepWhitespace: false
    css:
      version: 0                  # 0 = CSS più recente (forme più corte)
      precision: 0                # 0 = nessun arrotondamento dei numeri
    js:
      keepVarNames: false
      version: 0                  # 0 = sintassi JS più recente
      precision: 0
    json:
      keepNumbers: false
      precision: 0
    svg:
      keepComments: false
      precision: 0
    xml:
      keepWhitespace: false
